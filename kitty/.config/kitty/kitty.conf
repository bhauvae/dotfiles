# Theme
include themes/mocha.conf

# Typography
font_family JetBrains Nerd Font
font_size 10

# JetBrains font features in kitty need the exact PostScript font name, not just
# the family name, so fill that in after checking with fc-scan or kitty choose-fonts.
# Example shape only:
# font_features <POSTSCRIPT-NAME> +ss02 +ss03 +ss05 +ss07

# Scrollback
scrollback_lines 10000

# Mouse / selection
mouse_hide_wait -1.0
wheel_scroll_multiplier 1.0
copy_on_select clipboard

# Quit behavior
confirm_os_window_close 0
